<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel do Administrador | AutoContábil Hub — Notícias</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">
  <div id="portal-header"></div>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-10">
    <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center shadow-sm">
      <h1 class="text-2xl font-extrabold text-slate-900">⚙️ Painel do Administrador</h1>
      <p class="text-sm text-slate-600 mt-2">O editor de notícias e painel de moderação serão ativados na <strong>Fase 4</strong> (logo após testarmos a área pública da Fase 3).</p>
      <a href="noticias.html" class="mt-5 inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl px-4 py-2 text-xs transition">Ir para a lista de notícias</a>
    </div>
  </main>

  <div id="portal-footer"></div>

  <script type="module">
    import { initPortalLayout } from './js/portal/layout.js';
    const { isAdmin } = await initPortalLayout('admin');
    if (!isAdmin) {
      window.location.href = 'entrar.html';
    }
  </script>
</body>
</html>
