<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testes locais de CNPJ | AutoContábil Hub</title>
  <meta name="description" content="Testes manuais locais para a validação de CNPJ numérico e alfanumérico.">
  <link rel="canonical" href="https://yuridavid9.github.io/Projeto-Contabil/tests.html">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-slate-50 p-6 text-slate-800">
  <main class="mx-auto max-w-2xl rounded-xl border border-slate-200 bg-white p-6">
    <h1 class="text-2xl font-bold">Testes de CNPJ</h1>
    <p id="test-result" class="mt-3" aria-live="polite">Executando testes…</p>
    <p class="mt-4"><a class="text-indigo-700 underline" href="index.html">Voltar ao AutoContábil Hub</a></p>
  </main>
  <script type="module">
    import { validCNPJ } from './js/utilitiesModule.js';

    const cases = [
      ['CNPJ numérico válido', '11.222.333/0001-81', true],
      ['CNPJ numérico inválido', '11.222.333/0001-80', false],
      ['CNPJ alfanumérico válido', '12.ABC.345/01DE-35', true],
      ['CNPJ alfanumérico com DV inválido', '12.ABC.345/01DE-36', false]
    ];
    const results = cases.map(([name, value, expected]) => ({ name, expected, actual: validCNPJ(value), passed: validCNPJ(value) === expected }));
    console.table(results);
    const failures = results.filter((result) => !result.passed);
    document.querySelector('#test-result').textContent = failures.length
      ? `${failures.length} teste(s) falharam. Consulte o Console.`
      : `${results.length} testes passaram. Consulte o Console para ver os casos.`;
    if (failures.length) throw new Error('Falha nos testes de CNPJ.');
  </script>
</body>
</html>
